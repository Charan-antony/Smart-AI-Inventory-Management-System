<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart AI Inventory Management System</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow: hidden;
            background: var(--bg-primary);
        }
        .auth-wrapper::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(6, 182, 212, 0.1) 50%, transparent 70%);
            filter: blur(90px);
            top: -10%;
            left: 20%;
            pointer-events: none;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            position: relative;
            z-index: 2;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-header .logo-icon {
            width: 52px;
            height: 52px;
            border-radius: var(--radius-md);
            background: var(--gradient-primary);
            color: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin: 0 auto 1rem auto;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }
        .auth-header h2 {
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }
        .auth-header p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-footer-links {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .auth-footer-links a {
            color: var(--primary);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card glass-card">
            <div class="auth-header">
                <div class="logo-icon">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to InvAI Control Center</p>
            </div>

            <form id="login-form">
                <div class="form-group" id="group-email">
                    <label class="form-label" for="login-email">Email or Username</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="login-email" class="form-control" placeholder="alex.mercer@inventoryai.com" value="alex.mercer@inventoryai.com" required>
                    </div>
                    <span class="form-error-msg">Please enter a valid email address</span>
                </div>

                <div class="form-group" id="group-password">
                    <label class="form-label" for="login-password">
                        Password
                        <a href="#" onclick="openModal('forgot-modal'); return false;" style="font-weight:500; font-size:0.8rem; color:var(--primary);">Forgot Password?</a>
                    </label>
                    <div class="input-icon-wrapper" style="position:relative;">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="login-password" class="form-control" placeholder="••••••••" value="password123" required>
                        <button type="button" class="password-toggle-btn" id="toggle-pwd-btn" title="Show/Hide Password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                    <span class="form-error-msg">Password must be at least 6 characters</span>
                </div>

                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                    <label class="checkbox-group">
                        <input type="checkbox" id="remember-me" checked>
                        <span>Remember me on this device</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In to Dashboard
                </button>
            </form>

            <div class="auth-footer-links">
                Don't have an account? <a href="register.html">Register Account</a>
            </div>
            <div style="text-align:center; margin-top:1.5rem;">
                <a href="index.html" style="font-size:0.85rem; color:var(--text-dim);"><i class="fa-solid fa-arrow-left"></i> Back to Home Page</a>
            </div>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgot-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 class="modal-title"><i class="fa-solid fa-key" style="color:var(--primary);"></i> Reset Password</h3>
                <button class="modal-close-btn" onclick="closeModal('forgot-modal')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1rem;">Enter your account email address and we will send you a password reset code.</p>
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" placeholder="yourname@company.com">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal('forgot-modal')">Cancel</button>
                <button class="btn btn-primary" onclick="showToast('Password reset link sent to your email!', 'success'); closeModal('forgot-modal');">Send Reset Code</button>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
    <script>
        // Password toggle
        const pwdInput = document.getElementById('login-password');
        const toggleBtn = document.getElementById('toggle-pwd-btn');
        if (toggleBtn && pwdInput) {
            toggleBtn.addEventListener('click', () => {
                const type = pwdInput.type === 'password' ? 'text' : 'password';
                pwdInput.type = type;
                toggleBtn.querySelector('i').className = type === 'password' ? 'fa-solid fa-eye' : 'fa-solid fa-eye-slash';
            });
        }

        // Form Submit
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email || !password) {
                showToast('Please enter both email and password.', 'danger', 'Authentication Error');
                return;
            }

            showToast('Login successful! Redirecting to dashboard...', 'success', 'Welcome Alex Mercer');
            setTimeout(() => {
                window.location.href = 'dashboard.html';
            }, 1000);
        });
    </script>
</body>
</html>
